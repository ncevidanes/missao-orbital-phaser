<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=contain"
    />
    <meta
      name="description"
      content="Missão Orbital Green Terminal Edition: sobreviva a asteroides e meteoros errantes em um arcade monocromático."
    />
    <title>Missão Orbital — Retro Edition</title>
  </head>
  <body>
    <main class="page-shell">
      <header class="game-header">
        <div>
          <p class="eyebrow">&gt; GREEN TERMINAL ARCADE_</p>
          <h1>Missão Orbital</h1>
        </div>
        <p class="controls">[MOVE: SETAS/WASD/TOQUE] [MENU: M]</p>
      </header>

      <section
        id="game-container"
        class="game-container"
        aria-label="Área do jogo Missão Orbital"
      ></section>

      <p class="orientation-hint">No celular, jogue na horizontal.</p>

      <p class="tip">
        &gt; Colete cristais, monitore meteoros errantes e sobreviva por 60 segundos.
      </p>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
