<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
          content="Missão Orbital: colete cristais e power-ups, desvie de asteroides e bata seu recorde."
    />
    <title>Missão Orbital</title>
  </head>
  <body>
    <main class="page-shell">
      <header class="game-header">
        <div>
          <p class="eyebrow">JOGO 2D COM PHASER</p>
          <h1>Missão Orbital</h1>
        </div>
        <p class="controls">Mover: setas ou WASD · Menu: M</p>
      </header>

      <section
        id="game-container"
        class="game-container"
        aria-label="Área do jogo Missão Orbital"
      ></section>

      <p class="tip">
        Colete cristais e power-ups, sobreviva por 60 segundos e supere seu recorde.
      </p>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
